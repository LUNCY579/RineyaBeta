name: Official family migration mechanics
on:
  push:
    branches:
      - research/query-refinement-official-family-v1
      - research/composition-qrr-official-family-v1
    paths:
      - experiments/official_family_v1/**
      - experiments/query_refinement_v1/**
      - experiments/composition_qrr_v1/**
      - .github/workflows/official-family.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mechanical-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      CUBLAS_WORKSPACE_CONFIG: ':4096:8'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned CPU fixture runtime
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r experiments/official_family_v1/requirements.txt
      - name: Test shared migration and inherited experiment
        shell: bash
        run: |
          set -euo pipefail
          python -c 'from transformers import Qwen3Config, Qwen3ForCausalLM, Qwen2TokenizerFast'
          tests=(experiments/official_family_v1/tests)
          for name in composition_qrr_v1 query_refinement_v1; do
            if [ -d "experiments/$name/tests" ]; then tests+=("experiments/$name/tests"); fi
          done
          python -m compileall -q experiments/official_family_v1
          python -m pytest -c /dev/null -q "${tests[@]}" --junitxml=family-tests.xml 2>&1 | tee family-tests.log
          python - <<'PY'
          import json, pathlib, xml.etree.ElementTree as ET
          root = ET.parse('family-tests.xml').getroot()
          suites = list(root.iter('testsuite'))
          result = {k: sum(int(s.get(k, 0)) for s in suites) for k in ('tests', 'failures', 'errors', 'skipped')}
          result.update(evidence_class='MECHANICAL_FIXTURES_ONLY', pretrained_model_executed=False,
                        licenses_training=False, licenses_sealed_evaluation=False)
          pathlib.Path('family-ci-summary.json').write_text(json.dumps(result, indent=2) + '\n')
          print(json.dumps(result))
          PY
      - name: Preserve mechanical evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: family-mechanical-evidence
          path: |
            family-tests.log
            family-tests.xml
            family-ci-summary.json
          if-no-files-found: warn
