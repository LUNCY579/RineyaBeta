name: Query refinement v1 mechanics
on:
  push:
    branches: [research/query-refinement-attention-v1]
    paths: ['experiments/query_refinement_v1/**', '.github/workflows/query-refinement-v1.yml']
  pull_request:
    paths: ['experiments/query_refinement_v1/**', '.github/workflows/query-refinement-v1.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qref-${{ github.ref }}
  cancel-in-progress: true
jobs:
  mechanics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      CUBLAS_WORKSPACE_CONFIG: ':4096:8'
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated CPU dependencies
        run: |
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r experiments/query_refinement_v1/requirements.txt
      - name: Require native Qwen3 and run every test
        run: |
          python -c 'from transformers import Qwen3ForCausalLM; import torch; print(torch.__version__)'
          python -m pytest experiments/query_refinement_v1/tests -ra --junitxml=qref-junit.xml
      - name: Preserve native random-weight qualification (not R2)
        run: |
          python - <<'PY'
          import json, os, torch
          from transformers import Qwen3Config, Qwen3ForCausalLM
          from experiments.query_refinement_v1.pipeline import qualify, source_manifest, environment
          torch.set_num_threads(1)
          torch.manual_seed(901)
          c = Qwen3Config(hidden_size=32, intermediate_size=64, num_hidden_layers=3,
              num_attention_heads=4, num_key_value_heads=2, head_dim=16, vocab_size=73,
              max_position_embeddings=128, attention_dropout=0)
          c._attn_implementation = 'eager'
          result = {'stage': 'P1_native_random_weights', 'commit': os.environ['GITHUB_SHA'],
              'checks': qualify(Qwen3ForCausalLM(c).eval(), 1, 3),
              'source_files': source_manifest(), 'environment': environment(),
              'real_r2_executed': False, 'licenses_training': False,
              'licenses_sealed_evaluation': False, 'quality_claim_authorized': False}
          text = json.dumps(result, indent=2, sort_keys=True, allow_nan=False)
          open('qref-native.json', 'w').write(text+'\n')
          print(text)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qref-mechanics-${{ github.sha }}
          path: |
            qref-junit.xml
            qref-native.json
