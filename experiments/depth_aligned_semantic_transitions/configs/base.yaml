experiment:
  name: dast-state-ordered-dev
  arm: state_ordered
  seed: 17
  output_dir: ../runs/state_ordered_seed17
  preregistration_frozen: false
  preregistration_sha256: ""
  allow_sealed_test: false

model:
  name_or_path: Qwen/Qwen3-0.6B
  revision: main
  local_files_only: true
  trust_remote_code: false
  precision: auto
  quantization: none
  device_map: null
  attn_implementation: null
  max_length: 512
  # 0.964 * 28 -> 27, deliberately NOT 28. hidden_states[28] is post-final-norm
  # while 7/14/21 are raw residual states, so a schedule ending at 1.0 feeds two
  # representation classes into the single shared projector. Measured pooled
  # cosine, 600 DEV problems: 7v28 = -0.018 raw and -0.111 even after norming
  # 7/14/21, versus +0.409 for the 7/14/21/27 schedule below, which is the only
  # variant with no near-orthogonal outlier and a uniform scale.
  checkpoint_fractions: [0.25, 0.50, 0.75, 0.964]
  checkpoint_readout: final_norm
  pooling: mean
  feedback_enabled: false
  feedback_scale: 0.05

data:
  # data/manifests/problem_manifest.jsonl is a METADATA manifest: it carries
  # problem_id, split, step_count and hashes, but none of problem, answer,
  # full_response, reasoning_steps or compact_state_trace. Pointing data.path at
  # it fails on every record. The reasoning text lives one directory over, one
  # file per split, so the per-split overrides are used instead.
  #
  # These files are excluded by .gitignore, so a fresh checkout must supply the
  # corpus at this location (same convention as the base checkpoint directory).
  # The sealed split lives in test.jsonl, which no DEV config ever names - the
  # seal is physical here, not only enforced by assert_split_allowed.
  path: ""
  train_path: ../../../Rineya_state_experiment_bundle/rineya_sequence_independence_dataset_v1/data/full_context/train.jsonl
  eval_path: ../../../Rineya_state_experiment_bundle/rineya_sequence_independence_dataset_v1/data/full_context/dev.jsonl
  train_split: train
  eval_split: dev
  max_train_records: 4000
  max_eval_records: 800
  num_workers: 0
  system_prompt: Solve the problem carefully. Give a concise reasoning trace and make the final answer explicit.
  truncation: preserve_target

semantic:
  state_dim: 128
  projector_hidden_dim: 256
  target_projection_seed: 1701
  target_max_tokens: 64
  # As shipped, targets carried 56.6% of their variance in the PROBLEM factor and
  # only 9.3% in the STAGE factor, so a depth permutation rearranged only the
  # small component: state_ordered sat at 0.860 cosine from state_shuffled and
  # the frozen-probe order margin was 0.129. Centering each problem on its own
  # canonical-state mean moves that contrast to -0.019 and the margin to 0.977.
  target_centering: within_problem
  state_weight: 1.0
  contrastive_weight: 0.10
  contrastive_temperature: 0.07
  stage_weights: []

operators:
  enabled: false
  num_operators: 8
  rank: 8
  router_temperature: 1.0
  transition_weight: 0.0
  consistency_weight: 0.0
  diversity_weight: 0.0
  balance_weight: 0.0
  frozen_random: false

lora:
  enabled: true
  r: 16
  alpha: 32
  dropout: 0.05
  bias: none
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

training:
  epochs: 1
  # multi_positive_contrastive_loss returns exactly 0.0 when batch < 2, so at the
  # previous batch_size 1 the documented anti-collapse term contributed nothing.
  # Accumulation is halved so the effective batch and the optimizer-step budget
  # are unchanged, keeping every arm matched.
  batch_size: 2
  eval_batch_size: 2
  gradient_accumulation_steps: 8
  learning_rate: 0.0002
  auxiliary_learning_rate: 0.0002
  weight_decay: 0.01
  warmup_ratio: 0.03
  max_grad_norm: 1.0
  gradient_checkpointing: true
  fp32_trainable_params: true
  freeze_base_without_lora: true
  log_every_steps: 10
  eval_every_steps: 0
  save_every_steps: 0
  dataloader_shuffle: true
  deterministic_algorithms: false

evaluation:
  # At 128, 51% of DEV generations hit the cap without emitting EOS and strict
  # accuracy was 0.115; at 384 the hit-cap rate is 0.010 and strict accuracy is
  # 0.229, for 2x the decode cost (1.41 -> 2.78 s/problem at batch 4).
  max_new_tokens: 384
  do_generation: true
  generation_batch_size: 4
  temperature: 0.0
  top_p: 1.0
  bootstrap_samples: 5000
