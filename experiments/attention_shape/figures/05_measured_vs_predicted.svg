<rect x="34" y="480" width="1012" height="120" rx="9" fill="#fffbe9" stroke="#e0c060" stroke-width="1.4"/>
<text class="note" x="56" y="506" font-weight="700">The sliding-window rows have the smallest caches and the largest peaks.</text>
<text class="note" x="56" y="528">A sliding window is built as a dense [1,1,n,n] boolean mask, which scales with context rather than with the window — so</text>
<text class="note" x="56" y="548">w=256 and w=1024 have different caches and byte-identical peaks. The baseline gets no mask and takes the SDPA fast path.</text>
<text class="note" x="56" y="570" font-weight="700">Consequence: at 32K only the GQA rows fit. Reducing KV heads extends reachable context; narrowing the window does not.</text>
<text class="note" x="56" y="592">Sliding window still wins decode throughput (18.1 vs 11.4 tok/s at 16K) — it trades prefill and reach for steady-state speed.</text>
</svg>
