<rect width="1080" height="620" fill="#fbfcfd"/>
<text class="ttl" x="34" y="42">Cache is not the constraint. Peak memory is.</text>
<text class="sub" x="34" y="68">R2 at 16K context. Cache and peak allocation, measured on an RTX 4070 Laptop under a 6 GiB cap.</text>
