<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 520" width="1080" height="520" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<style>.ttl{font-size:24px;font-weight:700;fill:#10151c}.sub{font-size:14px;fill:#4a5568}.ax{font-size:12px;fill:#5a6472}.lg{font-size:13px;fill:#1a202c}.mono{font-family:Consolas,monospace;font-size:11.5px;fill:#10151c}.note{font-size:12.5px;fill:#4a5568}</style>
<rect width="1080" height="520" fill="#fbfcfd"/>
<text class="ttl" x="34" y="42">At one fixed cache budget, how much context do you get?</text>
<text class="sub" x="34" y="68">Budget = 3584 MiB — exactly what stock 8KV spends to hold 32K tokens.</text>
<text class="lg" x="314" y="150" text-anchor="end">GQA-8KV  (R2 today)</text>
<rect x="330" y="128" width="80.5" height="32" rx="5" fill="#1c4e8a"/>
<text class="mono" x="422.5" y="150">32,768 tokens</text>
<text class="mono" x="1008" y="150" fill="#5a6472">1.0×</text>
<text class="lg" x="314" y="202" text-anchor="end">GQA-2KV  (surgery + healing)</text>
<rect x="330" y="180" width="322.2" height="32" rx="5" fill="#7ba0d0" fill-opacity="0.55"/>
<text class="mono" x="664.2" y="202">131,072 tokens</text>
<text class="mono" x="1008" y="202" fill="#5a6472">4.0×</text>
<text class="lg" x="314" y="254" text-anchor="end">SWA w=1024, 4 global  (free)</text>
<rect x="330" y="232" width="548.7" height="32" rx="5" fill="#c2410c"/>
<text class="mono" x="890.7" y="254">223,232 tokens</text>
<text class="mono" x="1008" y="254" fill="#5a6472">6.8×</text>
<text class="lg" x="314" y="306" text-anchor="end">SWA w=256, 4 global  (free)</text>
<rect x="330" y="284" width="560.0" height="32" rx="5" fill="#ea8a4f"/>
<text class="mono" x="902.0" y="306">227,840 tokens</text>
<text class="mono" x="1008" y="306" fill="#5a6472">7.0×</text>
<text class="lg" x="314" y="358" text-anchor="end">MLA d_c=256  (new code)</text>
<rect x="330" y="336" width="515.5" height="32" rx="5" fill="#186a4e" fill-opacity="0.55"/>
<text class="mono" x="857.5" y="358">209,715 tokens</text>
<text class="mono" x="1008" y="358" fill="#5a6472">6.4×</text>
<text class="ax" x="330" y="402">longer is better — same bytes of cache in every row</text>
<rect x="34" y="402" width="1012" height="98" rx="9" fill="#fffbe9" stroke="#e0c060" stroke-width="1.4"/>
<text class="note" x="56" y="428" font-weight="700">Read this as the cost question, not just the capability question.</text>
<text class="note" x="56" y="450">The sliding-window rows are reached by editing a config file. The GQA row needs irreversible weight surgery and a healing run;</text>
<text class="note" x="56" y="470">the MLA row needs an attention module that does not exist yet in this stack. A free option that merely ties a paid one still wins.</text>
<text class="note" x="56" y="490">Caveat, and it is a big one: this is cache, not peak memory. Measured, the sliding rows OOM at 32K and the GQA rows do not — see figure 05.</text>
</svg>
