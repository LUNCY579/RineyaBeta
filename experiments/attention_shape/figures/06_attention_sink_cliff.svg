<text class="note" x="56" y="566" font-weight="700">The only rag_dev category left untouched is the one whose prompts fit inside the window.</text>
<text class="note" x="56" y="588">All 20 social cases are 41-45 tokens and score delta exactly 0.0000. Every other category runs past w=128 and collapses. The fix is to pin the first few tokens (StreamingLLM sinks), which transformers sliding_window does not do.</text>
