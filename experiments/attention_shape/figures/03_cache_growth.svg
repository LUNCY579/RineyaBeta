<rect x="34" y="584" width="1012" height="56" rx="9" fill="#fffbe9" stroke="#e0c060" stroke-width="1.4"/>
<text class="note" x="56" y="608">Straight lines on a log-log plot are constant cost per token: halving KV heads or lowering MLA rank shifts the line down but never bends it.</text>
<text class="note" x="56" y="628">The sliding-window curves bend. But this plot shows CACHE only: measured peak memory tells a different story — see figure 05.</text>
