  </g>

  <text class="tiny" x="620" y="268">1 KV head — cached</text>
  <rect x="730" y="274" width="12" height="24" rx="2" fill="#fbcfae" stroke="#c2410c" stroke-width="1.2"/>

  <text class="tiny" x="906" y="268">rank-256 latent — cached</text>
  <rect x="921" y="274" width="196" height="24" rx="4" fill="#fbcfae" stroke="#c2410c" stroke-width="1.4"/>
  <text class="tiny" x="1019" y="291" text-anchor="middle" fill="#7c2d12">c (256) ‖ k_R (64)</text>

  <!-- ================= cache bars ================= -->
  <text class="tiny" x="48"  y="336">cache per token, all 28 layers</text>
  <text class="tiny" x="334" y="336">cache per token, all 28 layers</text>
  <text class="tiny" x="620" y="336">cache per token, all 28 layers</text>
  <text class="tiny" x="906" y="336">cache per token, all 28 layers</text>

  <rect x="48"  y="344" width="232" height="26" rx="4" fill="#c2410c"/>
  <text class="mono" x="164" y="362" text-anchor="middle" fill="#fff">224 KiB</text>
  <rect x="334" y="344" width="116" height="26" rx="4" fill="#c2410c"/>
  <rect x="450" y="344" width="116" height="26" rx="4" fill="#eee" stroke="#d3dae3"/>
  <text class="mono" x="392" y="362" text-anchor="middle" fill="#fff">112 KiB</text>
  <rect x="620" y="344" width="14.5" height="26" rx="3" fill="#c2410c"/>
  <rect x="634" y="344" width="218" height="26" rx="4" fill="#eee" stroke="#d3dae3"/>
  <text class="mono" x="700" y="362" fill="#7c2d12">14 KiB</text>
  <rect x="906" y="344" width="18" height="26" rx="3" fill="#c2410c"/>
  <rect x="924" y="344" width="208" height="26" rx="4" fill="#eee" stroke="#d3dae3"/>
  <text class="mono" x="932" y="362" fill="#7c2d12">17.5 KiB</text>

  <!-- ================= notes ================= -->
  <text class="lbl" x="48"  y="408">Every head keeps its own keys</text>
  <text class="sm"  x="48"  y="428">and values. Maximum capacity,</text>
  <text class="sm"  x="48"  y="446">maximum cache. Qwen3 never</text>
  <text class="sm"  x="48"  y="464">shipped this at 0.6B.</text>

  <text class="lbl" x="334" y="408">Pairs of query heads share one</text>
  <text class="sm"  x="334" y="428">KV head. Halves the cache versus</text>
  <text class="sm"  x="334" y="446">MHA at little measured cost —</text>
  <text class="sm"  x="334" y="464">the default modern compromise.</text>

  <text class="lbl" x="620" y="408">All 16 query heads read one</text>
  <text class="sm"  x="620" y="428">shared key subspace. Cheapest</text>
  <text class="sm"  x="620" y="446">cache, and the point where head</text>
  <text class="sm"  x="620" y="464">diversity is genuinely lost.</text>

  <text class="lbl" x="906" y="408">Heads stay distinct; the shared</text>
  <text class="sm"  x="906" y="428">object is a low-rank code they</text>
  <text class="sm"  x="906" y="446">each decode differently. Cache</text>
  <text class="sm"  x="906" y="464">near MQA, capacity near MHA.</text>

  <rect x="48"  y="486" width="232" height="30" rx="6" fill="#f4f6f8" stroke="#d3dae3"/>
  <text class="tiny" x="164" y="505" text-anchor="middle">reduce by removing heads</text>
  <rect x="334" y="486" width="232" height="30" rx="6" fill="#f4f6f8" stroke="#d3dae3"/>
  <text class="tiny" x="450" y="505" text-anchor="middle">reduce by removing heads</text>
  <rect x="620" y="486" width="232" height="30" rx="6" fill="#f4f6f8" stroke="#d3dae3"/>
  <text class="tiny" x="736" y="505" text-anchor="middle">no heads left to remove</text>
  <rect x="906" y="486" width="226" height="30" rx="6" fill="#dcf0e6" stroke="#7fc0a5"/>
  <text class="tiny" x="1019" y="505" text-anchor="middle" fill="#186a4e">reduce by lowering rank</text>

  <text class="sm" x="48" y="542">requires healing after surgery</text>
  <text class="sm" x="334" y="542">— baseline —</text>
  <text class="sm" x="620" y="542">requires healing after surgery</text>
  <text class="sm" x="906" y="542" fill="#186a4e">requires new modelling code</text>

  <!-- footer -->
  <rect x="30" y="588" width="1120" height="82" rx="10" fill="#fffbe9" stroke="#e0c060" stroke-width="1.5"/>
  <text class="lbl" x="52" y="612" font-weight="700">The distinction that matters</text>
  <text class="sm" x="52" y="634">MHA → GQA → MQA is one axis: throw away heads. Capacity falls with the count, and there is nothing below 1.</text>
  <text class="sm" x="52" y="654">MLA changes the axis: hold all 16 heads and compress the thing they read. Same bytes as MQA, without collapsing the heads.</text>
</svg>
