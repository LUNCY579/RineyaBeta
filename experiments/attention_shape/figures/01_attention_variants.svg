    .sm   { font-size: 11.5px; fill: #5a6472; }
    .lbl  { font-size: 12.5px; fill: #1a202c; }
    .mono { font-family: Consolas, "SF Mono", Menlo, monospace; font-size: 12px; fill: #10151c; }
    .tiny { font-family: Consolas, "SF Mono", Menlo, monospace; font-size: 10px; fill: #6b7684; }
    .lnk  { stroke: #b6c0cd; stroke-width: 1; fill: none; }
  </style>
  <rect width="1180" height="700" fill="#fbfcfd"/>
  <text class="ttl" x="34" y="44">Four ways to spend the KV cache</text>
  <text class="sub" x="34" y="70">16 query heads throughout; only what is stored per token changes. Qwen3-0.6B ships the second column.</text>

  <!-- column frames -->
  <g>
    <rect x="30"  y="96" width="268" height="470" rx="11" fill="#f6f7f9" stroke="#d3dae3" stroke-width="1.4"/>
    <rect x="316" y="96" width="268" height="470" rx="11" fill="#f2f6fc" stroke="#7ba0d0" stroke-width="2.2"/>
