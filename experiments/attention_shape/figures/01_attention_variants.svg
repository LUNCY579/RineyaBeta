    <path d="M1032,210 L1019,252"/><path d="M1062,210 L1019,252"/><path d="M1092,210 L1019,252"/><path d="M1122,210 L1019,252"/>
  </g>

  <!-- ================= KV rows ================= -->
  <text class="tiny" x="48" y="268">16 KV heads — cached</text>
  <g fill="#fbcfae" stroke="#c2410c" stroke-width="1.2">
    <rect x="48"  y="274" width="12" height="24" rx="2"/><rect x="63"  y="274" width="12" height="24" rx="2"/>
    <rect x="78"  y="274" width="12" height="24" rx="2"/><rect x="93"  y="274" width="12" height="24" rx="2"/>
    <rect x="108" y="274" width="12" height="24" rx="2"/><rect x="123" y="274" width="12" height="24" rx="2"/>
    <rect x="138" y="274" width="12" height="24" rx="2"/><rect x="153" y="274" width="12" height="24" rx="2"/>
    <rect x="168" y="274" width="12" height="24" rx="2"/><rect x="183" y="274" width="12" height="24" rx="2"/>
    <rect x="198" y="274" width="12" height="24" rx="2"/><rect x="213" y="274" width="12" height="24" rx="2"/>
    <rect x="228" y="274" width="12" height="24" rx="2"/><rect x="243" y="274" width="12" height="24" rx="2"/>
    <rect x="258" y="274" width="12" height="24" rx="2"/><rect x="273" y="274" width="12" height="24" rx="2"/>
  </g>

  <text class="tiny" x="334" y="268">8 KV heads — cached</text>
  <g fill="#fbcfae" stroke="#c2410c" stroke-width="1.2">
    <rect x="342" y="274" width="12" height="24" rx="2"/><rect x="372" y="274" width="12" height="24" rx="2"/>
