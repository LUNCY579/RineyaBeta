    <rect x="888" y="96" width="262" height="470" rx="11" fill="#eef8f4" stroke="#7fc0a5" stroke-width="2.2"/>
  </g>

  <text class="ph" x="164" y="126" text-anchor="middle">MHA</text>
  <text class="sm" x="164" y="145" text-anchor="middle">16 Q / 16 KV</text>
  <text class="ph" x="450" y="126" text-anchor="middle" fill="#1c4e8a">GQA — 16Q / 8KV</text>
  <text class="sm" x="450" y="145" text-anchor="middle">what R2 ships today</text>
  <text class="ph" x="736" y="126" text-anchor="middle">MQA</text>
  <text class="sm" x="736" y="145" text-anchor="middle">16 Q / 1 KV</text>
  <text class="ph" x="1019" y="126" text-anchor="middle" fill="#186a4e">MLA</text>
  <text class="sm" x="1019" y="145" text-anchor="middle">16 Q / rank-256 latent</text>

