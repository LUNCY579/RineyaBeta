    <path d="M54,210 L54,250"/><path d="M69,210 L69,250"/><path d="M84,210 L84,250"/><path d="M99,210 L99,250"/>
    <path d="M114,210 L114,250"/><path d="M129,210 L129,250"/><path d="M144,210 L144,250"/><path d="M159,210 L159,250"/>
