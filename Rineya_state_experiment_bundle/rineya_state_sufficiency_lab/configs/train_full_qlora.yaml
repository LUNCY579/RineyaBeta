# QLoRA variant of condition A. Both arms must use the SAME quantization setting.
extends: train_full.yaml

experiment:
  name: full_qlora
  output_dir: runs/train_full_qlora
  tags: [condition_A, qlora]

model:
  quantization: 4bit
  bnb_4bit_quant_type: nf4
  bnb_4bit_compute_dtype: bfloat16
  bnb_4bit_use_double_quant: true

training:
  gradient_checkpointing: true
  per_device_batch_size: 2
  gradient_accumulation_steps: 16
