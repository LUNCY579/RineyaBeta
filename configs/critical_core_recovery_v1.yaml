# Matched arm construction and recovery for CRCC v1.
experiment_id: crcc-v1

discovery:
  scan_summary: runs/critical_core/crcc-v1/scan/scan_summary.json

design:
  output: runs/critical_core/crcc-v1/design/arms.json
  allow_partial_scan: false
  include_manual_hypothesis: false
  minimum_core_depth: 1
  maximum_core_depth: 14
  random_seed: 20260831
  controls: [random, low_criticality, angular_high]

historical_reference:
  include: true
  # stage_09_drop_14_24_6_23_8_10_18_9_7 removed the complement.
  aegis_19_source_layers: [0, 1, 2, 3, 4, 5, 11, 12, 13, 15, 16, 17, 19, 20, 21, 22, 25, 26, 27]

build:
  source_model: Qwen3-0.6B
  model_root: runs/critical_core/crcc-v1/models
  hash_source_weights: true
  hash_output_weights: true

recovery:
  # Reuse, do not fork, the repository's deterministic/VRAM-capped trainer.
  template: configs/heal_b0.yaml
  arms: [crcc_monster, control_random, control_low_criticality, control_angular_high]
  reference_arms: [aegis_19_reference]
  # Seed 20260831 is the screen; the other two are frozen confirmatory replications.
  seeds: [20260831, 20260901, 20260902]
  config_root: runs/critical_core/crcc-v1/recovery/configs
  run_root: runs/critical_core/crcc-v1/recovery/runs
  adapter_root: runs/critical_core/crcc-v1/recovery/adapters
  matrix_output: runs/critical_core/crcc-v1/recovery/recovery_matrix.json
